name: Bug report
description: Report a reproducible problem with the app or its documentation.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not repeat a risky hardware action to complete this form.
        This is public: omit device serials, network addresses, authentication packets, actual ride records and complete logs.
        Screenshots should show empty state or synthetic sample data only.
  - type: input
    id: version
    attributes:
      label: App version or source commit
      description: Use the version shown in the app, a source commit, or documentation only.
      placeholder: "0.8.0"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build type
      options:
        - Published production APK
        - Published debug APK
        - Local source build
        - Documentation only
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android version and console model, if known
      description: General model/version information only. Do not include serial numbers, addresses or a device inventory.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest safe sequence. Mention whether the app was connected or a ride was active, if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: For controller issues, distinguish the displayed reading from any physical resistance or incline change.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Optional short sanitized error excerpt or synthetic-data screenshot. Do not attach complete logs or actual ride data.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed personal identifiers, credentials, raw captures and real ride data.
          required: true
